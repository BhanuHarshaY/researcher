script:
  followups:
    # Turns 2 and 3: the criteria arrive in two parts, as from a real researcher.
    - {after_turn: 1, kind: criteria_reveal, message: "I should have given you my criteria. Only randomized controlled trials of oral or intravenous ivermectin in people with confirmed or suspected COVID-19, compared with placebo, no treatment, standard care or another drug. No prophylaxis trials in people without COVID-19, no observational studies, no lab or animal studies, and no reviews. Please give me the full updated list of included trials."}
    - {after_turn: 2, kind: criteria_reveal, message: "A few more criteria: any other treatments must be the same in both arms. Add-on designs are fine, for example ivermectin plus standard care versus standard care, or ivermectin plus another drug versus that same drug alone. The study must be published between 2020 and 2022, retracted or withdrawn reports are out, and if a trial has both a preprint and a journal article, use the journal article. Please give me the full updated list of included trials with their main findings, and briefly synthesize the evidence on mortality, hospitalization and symptom resolution."}
    # Turn 4: asks about the first eligible paper (key, then gold, then other relevant) that the
    # agent's latest list left out.
    - {after_turn: 3, kind: why_excluded, message: 'Why didn''t you include "{title:missing:W4220754707,W4307043809,W4212973150,W3135420706,W3092176787,W3107056972,W3111064783,W3111068209,W3126179459,W3129242298,W3130646175,W3133698266,W3150247726,W3157727129,W3161928646,W3164512669,W3170319714,W3173645873,W3182729893,W3197929425,W4212946211,W4220768079,W4284890619,W4293176350,W4311938754,W3088905160,W3196420298,W4282595092,W4282964706,W4283363264,W4292148078,W4307216937,W4311753472,W4312323281,W4313121933}"?'}
    # Turn 5: the full exclusion list; each reason must be backed by a record the agent opened.
    - {after_turn: 4, kind: exclusion_list, message: "List the papers you considered and excluded, with the reason for each."}
