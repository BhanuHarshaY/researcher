script:
  followups:
    # Turn 2: the study design and the advisor's expectations, as a real researcher adds them.
    - {after_turn: 1, kind: criteria_reveal, message: "Some more context. My study is an online experiment where people choose between advice from an algorithm and advice from a human expert, across tasks that range from forecasting to things that feel more subjective, like predicting which jokes or movies someone will like. So the section should cover the evidence on both sides, aversion and appreciation, and what makes people more or less willing to rely on algorithms. My advisor also wants it to cover where this debate started, long before anyone called it algorithm aversion. Please revise the section."}
    # Turn 3: asks about the first expected paper the agent's latest reply left out (never the hidden key).
    - {after_turn: 2, kind: why_excluded, message: 'I expected to see "{title:missing:W2800068874,W3125633690,W3121705224,W2942858056,W2913854599,W2158570360,W2070125214,W2150479185,W2085105383,W1522638407,W3144406692,W2104546629,W2168729696,W2137384635,W2032056105,W2020463305,W2981686111,W2600700815,W2886363025,W2171321543,W2056418346}" cited. Why did you leave it out?'}
    # Turn 4: makes the agent state what each paper of the misattribution pairs found.
    - {after_turn: 3, kind: contrast_pair, message: "Our design builds most directly on the Dietvorst et al. and Logg et al. studies, so reviewers will read that part closely. Can you add a paragraph that says exactly what each of those studies found and how their findings differ?"}
    # Turn 5: the final section; the persona sends /done after it.
    - {after_turn: 4, kind: final_section, message: "Thanks. Please put everything together into the final version of the related-work section."}
